<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Gallery</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1d2433;
}

/* ================= HEADER ================= */

header{
  background:white;
  padding:12px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
}

/* ACTUAL LOGO */

.logo-image{
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-image img{
  height:55px;
  width:auto;
  max-width:220px;
  object-fit:contain;
  display:block;
}


/* ================= HERO ================= */

.hero{
  background:linear-gradient(135deg,#1769aa,#0b3f70);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
  opacity:.9;
}


/* ================= CONTAINER ================= */

.container{
  width:90%;
  max-width:1200px;
  margin:40px auto;
}


/* ================= PROFILE GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,.14);
}

.card-image{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#e9edf3;
}

.card-content{
  padding:18px;
}

.card-content h3{
  color:#1769aa;
  margin-bottom:6px;
  font-size:20px;
}

.card-content .role{
  font-size:14px;
  font-weight:bold;
  color:#555;
  margin-bottom:8px;
}

.card-content p{
  color:#777;
  font-size:14px;
  line-height:1.5;
}


/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:999;
  padding:30px 15px;
  overflow:auto;
}

.modal-box{
  background:white;
  width:95%;
  max-width:900px;
  margin:20px auto;
  border-radius:16px;
  overflow:hidden;
  animation:popup .25s ease;
}

@keyframes popup{
  from{
    transform:scale(.9);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.modal-header{
  padding:20px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

.modal-header h2{
  color:#1769aa;
}

.close{
  font-size:30px;
  cursor:pointer;
  color:#777;
}

.close:hover{
  color:#000;
}

.modal-body{
  padding:25px;
}

.modal-info{
  margin-bottom:25px;
}

.modal-info h3{
  margin-bottom:8px;
  color:#1769aa;
}

.modal-info p{
  color:#555;
  line-height:1.6;
}


/* ================= GALLERY ================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.gallery img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  transition:.25s;
  background:#eee;
}

.gallery img:hover{
  transform:scale(1.03);
}


/* ================= FOOTER ================= */

footer{
  background:#0b3f70;
  color:white;
  text-align:center;
  padding:20px;
  margin-top:50px;
  font-size:14px;
}


/* ================= TABLET ================= */

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}


/* ================= MOBILE ================= */

@media(max-width:600px){

  header{
    padding:10px 20px;
  }

  .logo-image img{
    height:45px;
    max-width:180px;
  }

  .hero{
    padding:40px 15px;
  }

  .hero h1{
    font-size:28px;
  }

  .hero p{
    font-size:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .gallery img{
    height:150px;
  }

  .modal-body{
    padding:18px;
  }

}

</style>

</head>

/* =====================================================
   RENDER PROFILES
   ===================================================== */

const profileGrid =
document.getElementById("profileGrid");


function renderProfiles(){

  profileGrid.innerHTML="";

  profiles.forEach((profile,index)=>{

    const firstPhoto =
    "photos/"+profile.photos[0];

    const card =
    document.createElement("div");

    card.className="card";

    card.onclick=function(){

      openProfile(index);

    };


    card.innerHTML=`

      <img
        class="card-image"
        src="${firstPhoto}"
        alt="${escapeHtml(profile.name)}"
        onerror="this.style.display='none'"
      >

      <div class="card-content">

        <h3>
          ${escapeHtml(profile.name)}
        </h3>

        <div class="role">
          ${escapeHtml(profile.role)}
        </div>

        <p>
          ${escapeHtml(profile.description)}
        </p>

      </div>

    `;


    profileGrid.appendChild(card);

  });

}



/* =====================================================
   OPEN PROFILE
   ===================================================== */

function openProfile(index){

  const profile =
  profiles[index];


  document.getElementById("modalName")
  .textContent=profile.name;


  document.getElementById("modalRole")
  .textContent=profile.role;


  document.getElementById("modalDescription")
  .textContent=profile.description;


  const gallery =
  document.getElementById("modalGallery");


  gallery.innerHTML="";


  profile.photos.forEach(photo=>{

    const img =
    document.createElement("img");


    img.src =
    "photos/"+photo;


    img.alt =
    profile.name;


    img.onerror=function(){

      this.style.display="none";

    };


    gallery.appendChild(img);

  });


  document.getElementById("profileModal")
  .style.display="block";


  document.body.style.overflow="hidden";

}



/* =====================================================
   CLOSE MODAL
   ===================================================== */

function closeModal(){

  document.getElementById("profileModal")
  .style.display="none";


  document.body.style.overflow="auto";

}



/* =====================================================
   CLICK OUTSIDE MODAL
   ===================================================== */

window.onclick=function(event){

  const modal =
  document.getElementById("profileModal");


  if(event.target===modal){

    closeModal();

  }

};



/* =====================================================
   ESC KEY
   ===================================================== */

document.addEventListener("keydown",function(event){

  if(event.key==="Escape"){

    closeModal();

  }

});



/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHtml(text){

  const div =
  document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}



/* =====================================================
   START
   ===================================================== */

renderProfiles();
