<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Gallery</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1d2433;
}

.page{
  max-width:1200px;
  margin:0 auto;
  padding:35px 20px 50px;
}

/* =========================
   LOGO
========================= */

.logo-box{
  width:280px;
  height:140px;
  margin:10px auto 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.logo-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* =========================
   INTRO TEXT
========================= */

.intro-text{
  text-align:center;
  font-size:18px;
  line-height:1.6;
  margin:0 auto 25px;
  max-width:700px;
  color:#555;
}

/* =========================
   VIEW BUTTON
========================= */

.view-btn{
  display:block;
  margin:0 auto 40px;
  padding:14px 32px;
  font-size:17px;
  font-weight:600;
  color:white;
  background:#1d4ed8;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.view-btn:hover{
  background:#163ca5;
  transform:translateY(-2px);
}

/* =========================
   PROFILES
========================= */

.profiles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.profile-card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.3s;
}

.profile-card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.profile-photo{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 15px;
  background:#e9edf5;
}

.profile-placeholder{
  width:120px;
  height:120px;
  border-radius:50%;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e9edf5;
  color:#555;
  font-size:28px;
  font-weight:bold;
}

.profile-card h3{
  font-size:20px;
  margin-bottom:7px;
}

.profile-card p{
  color:#666;
  font-size:15px;
}

/* =========================
   HINT
========================= */

.hint{
  text-align:center;
  margin-top:30px;
  color:#777;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.profile-detail{
  position:relative;
  width:100%;
  max-width:850px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:16px;
  padding:30px;
}

.close{
  position:absolute;
  top:12px;
  right:15px;
  width:40px;
  height:40px;
  border:none;
  background:#eee;
  border-radius:50%;
  font-size:27px;
  cursor:pointer;
}

.detail-top{
  display:flex;
  align-items:center;
  gap:25px;
  margin-bottom:25px;
}

.detail-main-photo{
  width:150px;
  height:150px;
  border-radius:12px;
  object-fit:cover;
  display:none;
}

.detail-placeholder{
  width:150px;
  height:150px;
  border-radius:12px;
  background:#e9edf5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  color:#555;
}

.detail-title h2{
  font-size:28px;
  margin-bottom:8px;
}

.detail-title p{
  color:#666;
  font-size:17px;
}

.detail-text{
  font-size:16px;
  line-height:1.7;
  color:#444;
  margin-bottom:25px;
}

.gallery-title{
  font-size:21px;
  margin-bottom:15px;
}

.inner-gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.inner-gallery img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  background:#eee;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .profiles{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .page{
    padding:25px 15px 40px;
  }

  .logo-box{
    width:240px;
    height:120px;
  }

  .intro-text{
    font-size:16px;
  }

  .profiles{
    grid-template-columns:1fr;
  }

  .detail-top{
    flex-direction:column;
    text-align:center;
  }

  .inner-gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .inner-gallery img{
    height:140px;
  }

  .profile-detail{
    padding:25px 18px;
  }

}
</style>
</head>

<body>

  <!-- LOGO -->

    <img src="photos/logo.png" alt="ABC Life Insurance Logo">
  </div>

  <!-- INTRO TEXT -->

    Welcome to our profile gallery.<br>
    Click the button below to explore profiles and view photos.
  </p>

  <!-- VIEW PROFILES BUTTON -->
  <button
    class="view-btn"
    id="viewProfilesBtn"
    onclick="showProfiles()">
    View Profiles
  </button>

  <!-- PROFILES -->
  <div class="profiles" id="profiles"></div>

  <p class="hint" id="hint">
    Click on any profile to view details and photos.
  </p>

</div>


<!-- =========================
     PROFILE MODAL
========================= -->

<div
  class="modal"
  id="profileModal"
  onclick="closeOutside(event)"
>

  <div class="profile-detail">

    <button
      class="close"
      onclick="closeProfile()"
      aria-label="Close">
      ×
    </button>

    <div class="detail-top">

      <div
        id="detailPlaceholder"
        class="detail-placeholder">
        1
      </div>

      <img
        id="detailPhoto"
        class="detail-main-photo"
        alt="Profile photo">

      <div class="detail-title">

        <h2 id="detailName">

        <p id="detailRole">

      </div>

    </div>

    <p
      class="detail-text"

    </p>

    <h3 class="gallery-title">
      Photos
    </h3>

    <div
      class="inner-gallery"

  </div>

</div>

/* =================================
   VARIABLES
================================= */

let currentProfile = 0;


/* =================================
   SHOW PROFILES
================================= */

function showProfiles(){

  document.getElementById("profiles").scrollIntoView({
    behavior:"smooth"
  });

}


/* =================================
   RENDER PROFILES
================================= */

function renderProfiles(){

  const container =
    document.getElementById("profiles");

  container.innerHTML = "";

  profiles.forEach((profile,index)=>{

    const card =
      document.createElement("div");

    card.className = "profile-card";

    const firstPhoto =
      "photos/" + profile.photos[0];

    const image =
      document.createElement("img");

    image.className = "profile-photo";

    image.src = firstPhoto;

    image.alt = profile.name;

    image.onerror = function(){

      this.style.display = "none";

      const placeholder =
        document.createElement("div");

      placeholder.className =
        "profile-placeholder";

      placeholder.textContent =
        index + 1;

      this.parentNode.insertBefore(
        placeholder,
        this
      );

    };


    const name =
      document.createElement("h3");

    name.textContent =
      profile.name;


    const role =
      document.createElement("p");

    role.textContent =
      profile.role;


    card.appendChild(image);
    card.appendChild(name);
    card.appendChild(role);

    card.onclick = function(){

      openProfile(index);

    };

    container.appendChild(card);

  });

}


/* =================================
   OPEN PROFILE
================================= */

function openProfile(index){

  currentProfile = index;

  const profile =
    profiles[index];

  document.getElementById(
    "detailName"
  ).textContent =
    profile.name;

  document.getElementById(
    "detailRole"
  ).textContent =
    profile.role;

  document.getElementById(
    "detailText"
  ).textContent =
    profile.text;


  const detailPhoto =
    document.getElementById(
      "detailPhoto"
    );

  const placeholder =
    document.getElementById(
      "detailPlaceholder"
    );

  detailPhoto.style.display = "none";
  placeholder.style.display = "flex";

  detailPhoto.src =
    "photos/" + profile.photos[0];

  detailPhoto.onload = function(){

    placeholder.style.display = "none";

    detailPhoto.style.display = "block";

  };


  placeholder.textContent =
    index + 1;


  renderGallery();


  document.getElementById(
    "profileModal"
  ).classList.add("show");

  document.body.style.overflow =
    "hidden";

}


/* =================================
   RENDER GALLERY
================================= */

function renderGallery(){

  const gallery =
    document.getElementById(
      "innerGallery"
    );

  gallery.innerHTML = "";

  const profile =
    profiles[currentProfile];


  profile.photos.forEach(
    (photo)=>{

      const img =
        document.createElement("img");

      img.src =
        "photos/" + photo;

      img.alt =
        profile.name;

      img.onerror =
        function(){

          this.style.display =
            "none";

        };


      gallery.appendChild(img);

    }
  );

}


/* =================================
   CLOSE PROFILE
================================= */

function closeProfile(){

  document.getElementById(
    "profileModal"
  ).classList.remove("show");

  document.body.style.overflow =
    "";

}


/* =================================
   CLOSE OUTSIDE MODAL
================================= */

function closeOutside(event){

  if(
    event.target ===
    document.getElementById(
      "profileModal"
    )
  ){

    closeProfile();

  }

}


/* =================================
   ESC KEY
================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeProfile();

    }

  }
);


/* =================================
   INITIAL LOAD
================================= */

renderProfiles();
