<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Life Insurance - Profile Gallery</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#1d2433;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    text-align:center;
    padding:30px 20px 20px;
}

.logo{
    width:220px;
    max-width:80%;
    height:auto;
    display:block;
    margin:0 auto 18px;
}

.intro{
    font-size:17px;
    color:#555;
    line-height:1.6;
}


/* =========================================================
   MAIN
   ========================================================= */

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}


/* =========================================================
   COVER CARD
   IMPORTANT:
   COVER CARD IS NOT CHANGED
   ========================================================= */

.card-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.profile-card{
    width:320px;
    max-width:100%;
    background:white;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.profile-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 28px rgba(0,0,0,0.18);
}

.profile-card img{
    width:100%;
    height:250px;
    display:block;
    object-fit:cover;
}

.profile-name{
    margin-top:14px;
    font-size:20px;
    font-weight:bold;
    text-align:center;
}


/* =========================================================
   GALLERY MODAL
   ========================================================= */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    overflow-y:auto;
    padding:30px 20px;
}

.modal-content{
    max-width:1400px;
    margin:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    color:white;
}

.modal-title{
    font-size:28px;
    font-weight:bold;
}

.close-btn{
    font-size:42px;
    color:white;
    cursor:pointer;
    line-height:1;
    border:none;
    background:none;
}


/* =========================================================
   PHOTO GROUP
   ========================================================= */

.gallery-group{
    margin-bottom:40px;
}


/* =========================================================
   GALLERY PHOTO GRID
   3:4 RATIO
   NO CROP
   ========================================================= */

.photo-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    align-items:start;
}

.photo-grid img{
    width:100%;
    aspect-ratio:3 / 4;
    height:auto;
    display:block;
    cursor:pointer;
    border-radius:8px;
    background:#fff;
    object-fit:contain;
    transition:transform 0.2s ease;
}

.photo-grid img:hover{
    transform:scale(1.02);
}

.group-text{
    color:white;
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-top:14px;
}


/* =========================================================
   FULLSCREEN PHOTO VIEWER
   ========================================================= */

.photo-viewer{
    display:none;
    position:fixed;
    z-index:2000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.96);
    justify-content:center;
    align-items:center;
    padding:30px;
}

.photo-viewer img{
    max-width:95vw;
    max-height:90vh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
}

.viewer-close{
    position:absolute;
    top:15px;
    right:25px;
    color:white;
    font-size:45px;
    cursor:pointer;
    line-height:1;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer{
    text-align:center;
    padding:30px 15px;
    margin-top:50px;
    color:#666;
    font-size:14px;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

    .photo-grid{
        grid-template-columns:repeat(3, 1fr);
    }

}


@media(max-width:600px){

    .header{
        padding-top:20px;
    }

    .logo{
        width:180px;
    }

    .intro{
        font-size:15px;
    }

    .photo-grid{
        grid-template-columns:repeat(2, 1fr);
        gap:8px;
    }

    .modal{
        padding:20px 10px;
    }

    .modal-title{
        font-size:21px;
    }

    .group-text{
        font-size:18px;
    }

    .profile-card{
        width:100%;
        max-width:340px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <img
        id="ap1kaz"
        class="logo"
        src="photos/logo.png"
        alt="ABC Life Insurance Logo"
    >

    <p class="intro">
        Welcome to the ABC Life Insurance Profile Gallery.
        Explore and Connect with our people.
    </p>

</header>



<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="container">

    <div class="card-wrapper">


        <!-- =================================================
             COVER CARD
             THIS IS EXACTLY THE SAME
             ================================================= -->

        <div class="profile-card" onclick="openGallery()">

            <img
                src="photos/field-cover.jpg"
                alt="Field Learning Activity"
            >

        </div>


        <div class="profile-name">
            Field Learning Activity
        </div>

    </div>

</main>



<!-- =========================================================
     GALLERY MODAL
     ========================================================= -->

<div
    id="galleryModal"
    class="modal"
    onclick="galleryBackgroundClick(event)"
>

    <div class="modal-content">


        <div class="modal-header">

            <div class="modal-title">
                Field Learning Activity
            </div>


            <button
                class="close-btn"
                onclick="closeGallery()"
                aria-label="Close Gallery"
            >
                &times;
            </button>

        </div>


        <div id="galleryGroups"></div>

    </div>

</div>



<!-- =========================================================
     FULLSCREEN PHOTO VIEWER
     ========================================================= -->

<div
    id="photoViewer"
    class="photo-viewer"
    onclick="viewerBackgroundClick(event)"
>


    <span
        class="viewer-close"
        onclick="closePhoto()"
        aria-label="Close Photo"
    >
        &times;
    </span>


    <img
        id="largePhoto"
        src=""
        alt="Large Photo"
    >

</div>



<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer class="footer">

    <p>
        © 2026 ABC Life Insurance | All Rights Reserved.
    </p>

</footer>



<script>


/* =========================================================
   NAMES

   Each name belongs to ONE SET OF 5 PHOTOS.

   1  = Photo 1-5
   2  = Photo 6-10
   3  = Photo 11-15
   4  = Photo 16-20
   ...
   30 = Photo 146-150
   31 = Photo 151-155
   ========================================================= */

const names = [

    "1. Pawan Bhoyar",
    "2. Satyam Pandey",
    "3. Vinod Kumar",
    "4. Yogendra Rana",

    "5. Abendra Mishra",
    "6. Gayathri Krishnan",
    "7. K.Dhivya",
    "8. Mahesh Sajjan",
    "9. Vaibhav Shukla",
    "10. Jaya",

    "11. Rohan Yadav",
    "12. Nitin Shukla",
    "13. Akash Mohanty",
    "14. Devendra singh",
    "15. Deepak Jatav",
    "16. C R Adhithya Kumar",
    "17. Sumit Kumar",
    "18. Lokesh Kaimoria",
    "19. Kshma Kumari",
    "20. Jayakrishna Sai",

    "21. Apanna Patra",
    "22. Rakesh Chaurasiya",
    "23. Gourav Sengupta",
    "24. Shubham Kharde",
    "25. Sonam Kumari",
    "26. Siva Bramha Ganesh",
    "27. Rahul Kumar",
    "28. Bandaru Venkateshwarlu",
    "29. Vinita Bhardwaj",
    "30. Shivani Rajpoot",

    "31. Beddala Raj Kumar"

];



/* =========================================================
   EXISTING FIRST 20 PHOTOS
   ========================================================= */

const oldPhotos = [

    "field-01-01.jpg",
    "field-01-02.jpg",
    "field-01-03.jpg",
    "field-01-04.jpg",
    "field-01-05.jpg",

    "field-02-01.jpg",
    "field-02-02.jpg",
    "field-02-03.jpg",
    "field-02-04.jpg",
    "field-02-05.jpg",

    "field-03-01.jpg",
    "field-03-02.jpg",
    "field-03-03.jpg",
    "field-03-04.jpg",
    "field-03-05.jpg",

    "field-04-01.jpg",
    "field-04-02.jpg",
    "field-04-03.jpg",
    "field-04-04.jpg",
    "field-04-05.jpg"

];



/* =========================================================
   NEXT 135 PHOTOS

   21.jpg to 155.jpg
   ========================================================= */

const newPhotos = [];

for(let i = 21; i <= 155; i++){

    newPhotos.push(i + ".jpg");

}



/* =========================================================
   COMBINE ALL 155 PHOTOS
   ========================================================= */

const allPhotos = [

    ...oldPhotos,
    ...newPhotos

];



/* =========================================================
   CREATE 31 GROUPS

   Every group contains exactly 5 photos.

   31 groups × 5 photos = 155 photos
   ========================================================= */

const galleryGroups =
    document.getElementById("galleryGroups");


for(let group = 0; group < 31; group++){


    const groupDiv =
        document.createElement("div");

    groupDiv.className = "gallery-group";


    const photoGrid =
        document.createElement("div");

    photoGrid.className = "photo-grid";



    /* =====================================================
       ADD 5 PHOTOS
       ===================================================== */

    for(let photo = 0; photo < 5; photo++){


        const photoIndex =
            (group * 5) + photo;


        const img =
            document.createElement("img");


        img.src =
            "photos/" + allPhotos[photoIndex];


        img.alt =
            "Field Learning Activity Photo " +
            (photoIndex + 1);


        img.onclick = function(){

            openPhoto(this.src);

        };


        photoGrid.appendChild(img);

    }



    groupDiv.appendChild(photoGrid);



    /* =====================================================
       ADD NAME AFTER EVERY 5 PHOTOS
       ===================================================== */

    const text =
        document.createElement("div");


    text.className = "group-text";


    text.textContent =
        names[group] || "Add Name Here";


    groupDiv.appendChild(text);


    galleryGroups.appendChild(groupDiv);

}



/* =========================================================
   OPEN GALLERY
   ========================================================= */

function openGallery(){

    document.getElementById("galleryModal")
        .style.display = "block";


    document.body.style.overflow = "hidden";

}



/* =========================================================
   CLOSE GALLERY
   ========================================================= */

function closeGallery(){

    document.getElementById("galleryModal")
        .style.display = "none";


    document.body.style.overflow = "";

}



/* =========================================================
   OPEN LARGE PHOTO
   ========================================================= */

function openPhoto(src){

    const viewer =
        document.getElementById("photoViewer");


    const largePhoto =
        document.getElementById("largePhoto");


    largePhoto.src = src;


    viewer.style.display = "flex";

}



/* =========================================================
   CLOSE LARGE PHOTO
   ========================================================= */

function closePhoto(){

    const viewer =
        document.getElementById("photoViewer");


    viewer.style.display = "none";


    document.getElementById("largePhoto").src = "";

}



/* =========================================================
   CLOSE PHOTO WHEN CLICKING OUTSIDE IMAGE
   ========================================================= */

function viewerBackgroundClick(event){

    if(event.target.id === "photoViewer"){

        closePhoto();

    }

}



/* =========================================================
   CLOSE GALLERY WHEN CLICKING OUTSIDE CONTENT
   ========================================================= */

function galleryBackgroundClick(event){

    if(event.target.id === "galleryModal"){

        closeGallery();

    }

}



/* =========================================================
   ESC KEY
   ========================================================= */

document.addEventListener("keydown", function(event){


    if(event.key === "Escape"){


        const viewer =
            document.getElementById("photoViewer");


        const gallery =
            document.getElementById("galleryModal");



        if(viewer.style.display === "flex"){

            closePhoto();

        }

        else if(gallery.style.display === "block"){

            closeGallery();

        }

    }

});

</script>


</body>
</html>
