```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Life Insurance - Profile Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#1d2433;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:35px 20px 30px;
}

.logo{
    width:280px;
    height:140px;
    object-fit:contain;
    display:block;
    margin:0 auto 20px;
}

.intro{
    max-width:750px;
    margin:0 auto;
    font-size:17px;
    line-height:1.7;
    color:#5d6675;
}


/* =========================
   CARDS SECTION
========================= */

.profile-section{
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:35px;
}


/* =========================
   CARD
========================= */

.profile-item{
    text-align:center;
}

.profile-card{
    width:100%;
    height:300px;
    background:#ffffff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.10);
    transition:0.3s ease;
}

.profile-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(0,0,0,0.16);
}

.profile-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}


/* =========================
   TEXT BELOW CARD
========================= */

.profile-text{
    margin-top:14px;
    font-size:20px;
    font-weight:700;
    color:#202938;
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

    .profile-grid{
        grid-template-columns:repeat(2, 1fr);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding-top:25px;
    }

    .logo{
        width:240px;
        height:120px;
    }

    .intro{
        font-size:15px;
    }

    .profile-grid{
        grid-template-columns:1fr;
        gap:30px;
    }

    .profile-card{
        height:320px;
    }

    .profile-text{
        font-size:19px;
    }

}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:35px 15px;
    color:#7a8290;
    font-size:14px;
}

</style>
</head>


<body>


<!-- =========================
     LOGO + INTRO TEXT
========================= -->

<header class="header">

    <img
        class="logo"
        src="photos/logo.png"
        alt="ABC Life Insurance Logo"
    >

    <p class="intro">
        Welcome to the ABC Life Insurance Profile Gallery.
        Explore our team profiles and connect with our people.
    </p>

</header>


<!-- =========================
     PROFILE CARDS
========================= -->

<section class="profile-section">

    <div class="profile-grid">


        <!-- CARD 1 -->

        <div class="profile-item">

            <div class="profile-card">
                <img
                    src="photos/profile-1-1.jpg"
                    alt="Profile 1"
                    onerror="this.src='https://placehold.co/800x600?text=Photo';"
                >
            </div>

            <div class="profile-text">
                Profile 1
            </div>

        </div>


        <!-- CARD 2 -->

        <div class="profile-item">

            <div class="profile-card">
                <img
                    src="photos/profile-2-1.jpg"
                    alt="Profile 2"
                    onerror="this.src='https://placehold.co/800x600?text=Photo';"
                >
            </div>

            <div class="profile-text">
                Profile 2
            </div>

        </div>


        <!-- CARD 3 -->

        <div class="profile-item">

            <div class="profile-card">
                <img
                    src="photos/profile-3-1.jpg"
                    alt="Profile 3"
                    onerror="this.src='https://placehold.co/800x600?text=Photo';"
                >
            </div>

            <div class="profile-text">
                Profile 3
            </div>

        </div>


    </div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>
    © 2026 ABC Life Insurance. All Rights Reserved.
</footer>


</body>
</html>
```
