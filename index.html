<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile Gallery</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1d2433;
  min-height:100vh;
}

.page{
  width:min(1000px,94%);
  margin:0 auto;
  padding:35px 20px 60px;
}


/* =========================
   LOGO
========================= */

.logo-box{
  width:210px;
  height:105px;
  margin:0 auto 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  border-radius:8px;

  overflow:hidden;
}

.logo-box img{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;
}


/* =========================
   INTRO TEXT
========================= */

.intro-text{
  text-align:center;
  font-size:18px;
  color:#555;
  line-height:1.6;

  max-width:650px;

  margin:0 auto 20px;
}


/* =========================
   VIEW BUTTON
========================= */

.view-btn{
  display:block;

  margin:0 auto 42px;

  border:0;
  border-radius:12px;

  padding:14px 30px;

  background:#222;
  color:#fff;

  font-size:16px;
  font-weight:700;

  cursor:pointer;

  transition:.2s;
}

.view-btn:hover{
  transform:translateY(-2px);
  opacity:.9;
}


/* =========================
   PROFILES
========================= */

.profiles{
  display:none;

  grid-template-columns:repeat(3,1fr);

  gap:55px 75px;

  max-width:760px;

  margin:0 auto;
}

.profiles.show{
  display:grid;
}

.profile-card{
  border:0;
  background:transparent;

  cursor:pointer;

  text-align:center;

  transition:transform .2s ease;
}

.profile-card:hover{
  transform:translateY(-6px);
}


/* PROFILE IMAGE */

.profile-photo{
  width:125px;
  height:125px;

  margin:0 auto;

  border-radius:50%;

  overflow:hidden;

  border:4px solid white;

  box-shadow:0 6px 20px rgba(0,0,0,.16);

  background:linear-gradient(
    135deg,
    #dfe5ef,
    #b9c3d4
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#667085;

  font-size:42px;
  font-weight:700;
}

.profile-photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* PROFILE NAME */

.profile-name{
  margin-top:12px;

  font-size:16px;

  font-weight:600;
}


/* HINT */

.hint{
  text-align:center;

  color:#6b7280;

  margin:35px 0 0;

  font-size:14px;

  display:none;
}

.hint.show{
  display:block;
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  background:rgba(10,15,25,.65);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:1000;
}

.modal.active{
  display:flex;
}

.profile-detail{
  width:min(800px,100%);

  max-height:90vh;

  overflow-y:auto;

  background:#fff;

  border-radius:22px;

  padding:30px;

  position:relative;

  box-shadow:
    0 20px 70px rgba(0,0,0,.3);
}


/* CLOSE BUTTON */

.close{
  position:absolute;

  right:18px;
  top:14px;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#eef1f6;

  cursor:pointer;

  font-size:24px;
}


/* DETAIL TOP */

.detail-top{
  display:flex;

  align-items:center;

  gap:25px;

  margin-bottom:20px;

  padding-right:40px;
}


/* MAIN PHOTO */

.detail-main-photo{
  width:145px;
  height:145px;

  flex:0 0 145px;

  border-radius:50%;

  object-fit:cover;

  background:linear-gradient(
    135deg,
    #dfe5ef,
    #b9c3d4
  );

  display:none;
}


/* PLACEHOLDER */

.detail-placeholder{
  width:145px;
  height:145px;

  flex:0 0 145px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #dfe5ef,
    #b9c3d4
  );

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:48px;

  color:#667085;

  font-weight:700;
}


/* DETAIL TITLE */

.detail-title h2{
  font-size:28px;

  margin-bottom:7px;
}

.detail-title p{
  color:#667085;
}


/* DETAIL TEXT */

.detail-text{
  line-height:1.7;

  margin:15px 0 20px;

  color:#454b57;
}


/* =========================
   GALLERY
========================= */

.gallery-title{
  margin-bottom:14px;
}

.inner-gallery{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:14px;
}

.gallery-item{
  aspect-ratio:1/1;

  border-radius:12px;

  overflow:hidden;

  background:#e8ecf3;
}

.gallery-item img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  cursor:pointer;

  transition:.2s;
}

.gallery-item img:hover{
  transform:scale(1.03);
}


/* EMPTY GALLERY */

.empty-gallery{
  grid-column:1/-1;

  text-align:center;

  color:#778092;

  background:#f1f4f8;

  border-radius:12px;

  padding:28px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

  .page{
    padding-top:25px;
  }

  .logo-box{
    width:180px;
    height:90px;
  }

  .intro-text{
    font-size:16px;
  }

  .profiles{
    grid-template-columns:repeat(2,1fr);

    gap:35px 15px;
  }

  .profile-photo{
    width:95px;
    height:95px;

    font-size:30px;
  }

  .profile-name{
    font-size:14px;
  }

  .profile-detail{
    padding:22px;
  }

  .detail-top{
    gap:16px;
  }

  .detail-main-photo,
  .detail-placeholder{
    width:100px;
    height:100px;

    flex-basis:100px;
  }

  .detail-title h2{
    font-size:22px;
  }

  .inner-gallery{
    grid-template-columns:repeat(2,1fr);
  }
}

</style>
</head>

/* =====================================================
   CURRENT PROFILE
===================================================== */

let currentProfile = 0;


/* =====================================================
   SHOW PROFILES
===================================================== */

function showProfiles(){

  document
    .getElementById("profiles")
    .classList.add("show");

  document
    .getElementById("hint")
    .classList.add("show");


  const button =
    document.getElementById("viewProfilesBtn");


  button.textContent =
    "Profiles Opened";


  button.disabled =
    true;


  button.style.opacity =
    ".65";

}


/* =====================================================
   RENDER PROFILES
===================================================== */

function renderProfiles(){

  const container =
    document.getElementById("profiles");


  container.innerHTML =
    profiles.map((p,i)=>{


      const firstPhoto =
        p.photos && p.photos.length
        ? `photos/${p.photos[0]}`
        : "";


      return `

        <button
          class="profile-card"
          onclick="openProfile(${i})"
        >

          <div class="profile-photo">

            ${
              firstPhoto

              ?

              `<img
                src="${firstPhoto}"
                alt="${escapeHtml(p.name)}"
                onerror="
                  this.style.display='none';
                  this.parentElement.innerHTML='<span>${i+1}</span>';
                "
              >`

              :

              `<span>${i+1}</span>`
            }

          </div>


          <div class="profile-name">

            ${escapeHtml(p.name)}

          </div>

        </button>

      `;

    }).join("");

}


/* =====================================================
   OPEN PROFILE
===================================================== */

function openProfile(index){

  currentProfile =
    index;


  const p =
    profiles[index];


  document
    .getElementById("detailName")
    .textContent =
    p.name;


  document
    .getElementById("detailRole")
    .textContent =
    p.role;


  document
    .getElementById("detailText")
    .textContent =
    p.text;


  document
    .getElementById("detailPlaceholder")
    .textContent =
    index + 1;


  const detailPhoto =
    document.getElementById("detailPhoto");


  const placeholder =
    document.getElementById("detailPlaceholder");


  if(
    p.photos &&
    p.photos.length
  ){

    detailPhoto.src =
      "photos/" + p.photos[0];


    detailPhoto.style.display =
      "block";


    placeholder.style.display =
      "none";


    detailPhoto.onerror =
      function(){

        detailPhoto.style.display =
          "none";

        placeholder.style.display =
          "flex";

      };

  }

  else{

    detailPhoto.style.display =
      "none";

    placeholder.style.display =
      "flex";

  }


  document
    .getElementById("profileModal")
    .classList.add("active");


  renderGallery();

}


/* =====================================================
   RENDER GALLERY
===================================================== */

function renderGallery(){

  const gallery =
    document.getElementById("innerGallery");


  const p =
    profiles[currentProfile];


  if(
    !p.photos ||
    !p.photos.length
  ){

    gallery.innerHTML = `

      <div class="empty-gallery">

        No photos added yet.

      </div>

    `;

    return;

  }


  gallery.innerHTML =
    p.photos.map(
      (photo,index)=>{


        return `

          <div class="gallery-item">

            <img
              src="photos/${photo}"
              alt="${escapeHtml(p.name)} Photo ${index+1}"
              onerror="
                this.parentElement.style.display='none';
              "
            >

          </div>

        `;

      }
    ).join("");

}


/* =====================================================
   CLOSE PROFILE
===================================================== */

function closeProfile(){

  document
    .getElementById("profileModal")
    .classList.remove("active");

}


/* =====================================================
   CLOSE OUTSIDE
===================================================== */

function closeOutside(event){

  if(
    event.target.id ===
    "profileModal"
  ){

    closeProfile();

  }

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeProfile();

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return value.replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])

  );

}


/* =====================================================
   START WEBSITE
===================================================== */

renderProfiles();
