<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#1d2433;min-height:100vh}
.page{width:min(1000px,94%);margin:0 auto;padding:35px 20px 60px}

/* Logo + intro + button */
.logo-box{width:210px;height:105px;margin:0 auto 20px;border:3px solid #222;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;font-size:30px;font-weight:700;letter-spacing:2px}
.logo-box span{font-size:30px}
.intro-text{text-align:center;font-size:18px;color:#555;line-height:1.6;max-width:650px;margin:0 auto 20px}
.view-btn{display:block;margin:0 auto 42px;border:0;border-radius:12px;padding:14px 30px;background:#222;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.view-btn:hover{transform:translateY(-2px);opacity:.9}

/* Profiles */
.profiles{display:none;grid-template-columns:repeat(3,1fr);gap:55px 75px;max-width:760px;margin:0 auto}
.profiles.show{display:grid}
.profile-card{border:0;background:transparent;cursor:pointer;text-align:center;transition:transform .2s ease}
.profile-card:hover{transform:translateY(-6px)}
.profile-photo{width:125px;height:125px;margin:0 auto;border-radius:50%;overflow:hidden;border:4px solid white;box-shadow:0 6px 20px rgba(0,0,0,.16);background:linear-gradient(135deg,#dfe5ef,#b9c3d4);display:flex;align-items:center;justify-content:center;color:#667085;font-size:42px;font-weight:700}
.profile-photo img{width:100%;height:100%;object-fit:cover;display:none}
.profile-name{margin-top:12px;font-size:16px;font-weight:600}
.hint{text-align:center;color:#6b7280;margin:35px 0 0;font-size:14px;display:none}
.hint.show{display:block}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.active{display:flex}
.profile-detail{width:min(800px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:22px;padding:30px;position:relative;box-shadow:0 20px 70px rgba(0,0,0,.3)}
.close{position:absolute;right:18px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#eef1f6;cursor:pointer;font-size:24px}
.detail-top{display:flex;align-items:center;gap:25px;margin-bottom:20px;padding-right:40px}
.detail-main-photo{width:145px;height:145px;flex:0 0 145px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#dfe5ef,#b9c3d4);display:none}
.detail-placeholder{width:145px;height:145px;flex:0 0 145px;border-radius:50%;background:linear-gradient(135deg,#dfe5ef,#b9c3d4);display:flex;align-items:center;justify-content:center;font-size:48px;color:#667085;font-weight:700}
.detail-title h2{font-size:28px;margin-bottom:7px}
.detail-title p{color:#667085}
.detail-text{line-height:1.7;margin:15px 0 20px;color:#454b57}

/* Upload */
.upload-box{border:2px dashed #c9d1df;border-radius:14px;padding:18px;text-align:center;background:#f8faff;margin-bottom:20px}
.upload-box label{display:inline-block;background:#222;color:#fff;padding:11px 20px;border-radius:10px;cursor:pointer;font-weight:600}
.upload-box input{display:none}
.upload-note{font-size:13px;color:#697386;margin-top:9px}
.gallery-title{margin-bottom:14px}
.inner-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gallery-item{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#e8ecf3;position:relative}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.delete-photo{position:absolute;right:7px;top:7px;border:0;background:rgba(0,0,0,.65);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.empty-gallery{grid-column:1/-1;text-align:center;color:#778092;background:#f1f4f8;border-radius:12px;padding:28px}

/* Responsive */
@media(max-width:650px){
.profiles{grid-template-columns:repeat(2,1fr);gap:35px 15px}
.profile-photo{width:95px;height:95px;font-size:30px}
.profile-name{font-size:14px}
.profile-detail{padding:22px}
.detail-top{gap:16px}
.detail-main-photo,.detail-placeholder{width:100px;height:100px;flex-basis:100px}
.detail-title h2{font-size:22px}
.inner-gallery{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="page">

  <div class="logo-box"><span>LOGO</span></div>

  <p class="intro-text">
    Welcome to our profile gallery. Click the button below to explore profiles
    and view or upload photos for each profile.
  </p>

  <button class="view-btn" id="viewProfilesBtn" onclick="showProfiles()">
    View Profiles
  </button>

  <div class="profiles" id="profiles"></div>
  <p class="hint" id="hint">Click on any profile to view details and photos.</p>
</div>

<!-- PROFILE DETAIL -->
<div class="modal" id="profileModal" onclick="closeOutside(event)">
  <div class="profile-detail">
    <button class="close" onclick="closeProfile()" aria-label="Close">×</button>

    <div class="detail-top">
      <div id="detailPlaceholder" class="detail-placeholder">1</div>
      <img id="detailPhoto" class="detail-main-photo" alt="Profile photo">
      <div class="detail-title">
        <h2 id="detailName">Profile Name</h2>
        <p id="detailRole">Role / Designation</p>
      </div>
    </div>

    <p class="detail-text" id="detailText"></p>

    <div class="upload-box">
      <label for="photoInput">＋ Add Photos</label>
      <input id="photoInput" type="file" accept="image/*" multiple>
      <div class="upload-note">
        Select one or many photos at once. You can keep adding photos to this profile.
      </div>
    </div>

    <h3 class="gallery-title">Photos</h3>
    <div class="inner-gallery" id="innerGallery"></div>
  </div>
</div>

<script>
/*
  Photo storage uses IndexedDB.
  This allows a large number of photos compared with localStorage.
  The real limit depends on the browser/device storage available.
*/

const profiles = Array.from({length:30}, (_,i) => ({
  name: "Profile " + (i+1),
  role: "Role / Designation",
  text: "Information about Profile " + (i+1) + " will be added here.",
  photo: ""
}));

let currentProfile = 0;
const DB_NAME = "ProfileGalleryDB";
const STORE_NAME = "photos";

function openDB(){
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open(DB_NAME,1);

    request.onupgradeneeded = function(){
      const db = request.result;
      if(!db.objectStoreNames.contains(STORE_NAME)){
        const store = db.createObjectStore(STORE_NAME,{keyPath:"id",autoIncrement:true});
        store.createIndex("profileId","profileId",{unique:false});
      }
    };

    request.onsuccess = ()=>resolve(request.result);
    request.onerror = ()=>reject(request.error);
  });
}

async function addPhotos(profileId, files){
  const db = await openDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readwrite");
    const store = tx.objectStore(STORE_NAME);

    [...files].forEach(file=>{
      if(file.type.startsWith("image/")){
        store.add({
          profileId: profileId,
          name: file.name,
          type: file.type,
          blob: file
        });
      }
    });

    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

async function getPhotos(profileId){
  const db = await openDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readonly");
    const index = tx.objectStore(STORE_NAME).index("profileId");
    const request = index.getAll(profileId);

    request.onsuccess = ()=>resolve(request.result);
    request.onerror = ()=>reject(request.error);
  });
}

async function deletePhoto(id){
  const db = await openDB();

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE_NAME,"readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

function showProfiles(){
  document.getElementById("profiles").classList.add("show");
  document.getElementById("hint").classList.add("show");

  document.getElementById("viewProfilesBtn").textContent = "Profiles Opened";
  document.getElementById("viewProfilesBtn").disabled = true;
  document.getElementById("viewProfilesBtn").style.opacity = ".65";
}

function renderProfiles(){
  const container = document.getElementById("profiles");

  container.innerHTML = profiles.map((p,i)=>`
    <button class="profile-card" onclick="openProfile(${i})">
      <div class="profile-photo" id="avatar-${i}">
        <span>${i+1}</span>
      </div>
      <div class="profile-name">${p.name}</div>
    </button>
  `).join("");
}

async function openProfile(index){
  currentProfile = index;
  const p = profiles[index];

  document.getElementById("detailName").textContent = p.name;
  document.getElementById("detailRole").textContent = p.role;
  document.getElementById("detailText").textContent = p.text;
  document.getElementById("detailPlaceholder").textContent = index + 1;

  document.getElementById("profileModal").classList.add("active");

  await renderGallery();
}

async function renderGallery(){
  const gallery = document.getElementById("innerGallery");
  const photos = await getPhotos(currentProfile);

  if(!photos.length){
    gallery.innerHTML = `
      <div class="empty-gallery">
        No photos added yet.<br>
        Click <b>Add Photos</b> to upload photos for this profile.
      </div>`;
  } else {
    gallery.innerHTML = photos.map(item=>{
      const url = URL.createObjectURL(item.blob);
      return `
        <div class="gallery-item">
          <img src="${url}" alt="${escapeHtml(item.name)}">
          <button class="delete-photo" onclick="removePhoto(${item.id})" title="Delete photo">×</button>
        </div>`;
    }).join("");
  }

  updateProfileAvatar(currentProfile, photos);
}

async function updateProfileAvatar(profileId, photos){
  const avatar = document.getElementById("avatar-"+profileId);
  if(!avatar) return;

  if(photos.length){
    const first = photos[0];
    const url = URL.createObjectURL(first.blob);
    avatar.innerHTML = `<img src="${url}" alt="Profile photo" style="display:block">`;
  }
}

async function removePhoto(id){
  if(confirm("Delete this photo?")){
    await deletePhoto(id);
    await renderGallery();
  }
}

document.getElementById("photoInput").addEventListener("change", async function(){
  if(this.files.length){
    await addPhotos(currentProfile,this.files);
    this.value = "";
    await renderGallery();
  }
});

function closeProfile(){
  document.getElementById("profileModal").classList.remove("active");
}

function closeOutside(event){
  if(event.target.id === "profileModal") closeProfile();
}

document.addEventListener("keydown",function(event){
  if(event.key === "Escape") closeProfile();
});

function escapeHtml(value){
  return value.replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}

renderProfiles();
</script>
</body>
</html>
