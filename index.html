* { box-sizing:border-box; margin:0; padding:0; }

:root {
    --brand-red:#c8102e;
    --brand-dark:#8d1025;
    --brand-light:#fff4f5;
}

body {
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f9;
    color:#222;
}

header {
    background:white;
    padding:24px 18px;
    text-align:center;
    border-bottom:3px solid var(--brand-red);
}

.logo {
    display:block;
    max-width:220px;
    max-height:100px;
    width:auto;
    height:auto;
    object-fit:contain;
    margin:0 auto;
}

header h1 {
    margin-top:10px;
    color:var(--brand-red);
    font-size:25px;
    line-height:1.4;
}

header p {
    margin:10px auto 0;
    color:#555;
    line-height:1.6;
    max-width:800px;
}

header .tagline {
    margin-top:14px;
    color:var(--brand-dark);
    font-size:16px;
    font-weight:bold;
    letter-spacing:.3px;
}

main {
    max-width:1200px;
    padding:25px 16px;
    margin:auto;
}

.cards {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:22px;
}

.cover-card {
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 15px #00000012;
    cursor:pointer;
    transition:transform .2s,box-shadow .2s;
}

.cover-card:hover {
    transform:translateY(-5px);
    box-shadow:0 8px 22px #00000020;
}

/* Cover card design intentionally unchanged */
.cover-card img {
    display:block;
    width:100%;
    height:210px;
    object-fit:cover;
}

.card-title {
    padding:17px 12px;
    text-align:center;
    color:var(--brand-red);
    font-size:17px;
    font-weight:bold;
}

.insurance-card .card-title {
    white-space:nowrap;
    font-size:clamp(13px,4.1vw,17px);
    letter-spacing:-.35px;
}

footer {
    margin-top:30px;
    padding:20px;
    background:#292929;
    text-align:center;
    color:#fff;
    font-size:13px;
    line-height:1.6;
}

.modal {
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000c;
    overflow-y:auto;
    padding:20px;
}

.modal-content {
    background:#fff;
    max-width:1100px;
    width:100%;
    margin:15px auto;
    border-radius:12px;
    padding:22px;
    position:relative;
    min-height:300px;
}

.close {
    position:absolute;
    top:10px;
    right:15px;
    font-size:32px;
    border:none;
    background:transparent;
    color:#333;
    cursor:pointer;
    z-index:5;
}

.modal h2 {
    color:var(--brand-red);
    margin:12px 35px 20px 0;
}
