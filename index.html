```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Life Insurance Profile Gallery</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#1d2433;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:35px 20px 25px;
    background:#ffffff;
}

.logo{
    width:230px;
    max-width:80%;
    height:auto;
    display:block;
    margin:0 auto 18px;
}

.intro{
    max-width:750px;
    margin:auto;
    font-size:17px;
    line-height:1.6;
    color:#555;
}

/* =========================
   PROFILE CARDS
========================= */

.container{
    max-width:1200px;
    margin:40px auto;
    padding:0 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:30px;
    align-items:start;
}

.card-wrapper{
    text-align:center;
}

.profile-card{
    background:#ffffff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,0.10);
    cursor:pointer;
    transition:transform 0.25s ease,
               box-shadow 0.25s ease;
}

.profile-card:hover{
    transform:translateY(-6px);
    box-shadow:0 10px 28px rgba(0,0,0,0.16);
}

/* Main cover photo can be cropped */
.profile-card img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
}

.profile-name{
    margin-top:13px;
    font-size:19px;
    font-weight:700;
    color:#222;
}

/* =========================
   GALLERY MODAL
========================= */

.gallery-modal{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:rgba(0,0,0,0.82);
    overflow-y:auto;
    padding:35px 15px;
}

.gallery-box{
    width:min(1400px, 100%);
    margin:auto;
    background:#ffffff;
    border-radius:15px;
    padding:25px;
    position:relative;
}

.gallery-title{
    text-align:center;
    font-size:28px;
    margin-bottom:30px;
    color:#222;
}

.gallery-close{
    position:absolute;
    top:10px;
    right:18px;
    font-size:38px;
    line-height:1;
    color:#333;
    cursor:pointer;
    font-weight:bold;
    z-index:5;
}

.gallery-close:hover{
    color:#d00;
}

/* =========================
   GROUP
========================= */

.gallery-group{
    margin-bottom:45px;
    padding-bottom:35px;
    border-bottom:1px solid #ddd;
}

.gallery-group:last-child{
    border-bottom:none;
}

.group-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
    color:#222;
}

/*
   Gallery photos:
   ORIGINAL RATIO IS PRESERVED.
   No fixed height.
   No object-fit:cover.
*/
.photo-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:14px;
    align-items:start;
}

.photo-grid img{
    width:100%;
    height:auto;
    max-width:100%;
    display:block;
    border-radius:9px;
    cursor:pointer;
    background:#f1f1f1;
    transition:transform 0.2s ease,
               box-shadow 0.2s ease;
}

.photo-grid img:hover{
    transform:scale(1.02);
    box-shadow:0 5px 18px rgba(0,0,0,0.20);
}

/* =========================
   TEXT AFTER 5 PHOTOS
========================= */

.group-text{
    margin-top:18px;
    padding:15px 18px;
    background:#f5f7fb;
    border-radius:10px;
    font-size:17px;
    line-height:1.6;
    text-align:center;
    color:#333;
    min-height:55px;
}

/* =========================
   FULLSCREEN PHOTO VIEWER
========================= */

.photo-viewer{
    display:none;
    position:fixed;
    z-index:2000;
    inset:0;
    background:rgba(0,0,0,0.94);
    align-items:center;
    justify-content:center;
    padding:30px;
}

.photo-viewer img{
    /*
       Original ratio maintained.
       No forced width/height.
    */
    max-width:95vw;
    max-height:90vh;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:5px;
    display:block;
}

.viewer-close{
    position:absolute;
    top:12px;
    right:25px;
    color:white;
    font-size:48px;
    line-height:1;
    cursor:pointer;
    font-weight:300;
    z-index:10;
}

.viewer-close:hover{
    color:#ff5555;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .cards{
        grid-template-columns:repeat(2, 1fr);
    }

    .photo-grid{
        grid-template-columns:repeat(3, 1fr);
    }
}

@media(max-width:600px){

    .header{
        padding-top:25px;
    }

    .logo{
        width:190px;
    }

    .intro{
        font-size:15px;
    }

    .container{
        margin-top:25px;
    }

    .cards{
        grid-template-columns:1fr;
        gap:25px;
    }

    .profile-card img{
        height:230px;
    }

    .gallery-modal{
        padding:15px 8px;
    }

    .gallery-box{
        padding:18px 12px;
        border-radius:10px;
    }

    .gallery-title{
        font-size:22px;
        padding-right:25px;
    }

    .photo-grid{
        grid-template-columns:repeat(2, 1fr);
        gap:10px;
    }

    .group-text{
        font-size:15px;
    }

    .viewer-close{
        top:8px;
        right:15px;
        font-size:42px;
    }

    .photo-viewer{
        padding:15px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <img
        id="ap1kaz"
        class="logo"
        src="photos/logo.png"
        alt="ABC Life Insurance Logo"
    >

    <p class="intro">
        Welcome to the ABC Life Insurance Profile Gallery.
        Explore our team profiles and connect with our people.
    </p>

</header>


<!-- =========================
     PROFILE CARDS
========================= -->

<main class="container">

    <div class="cards">

        <!-- CARD 1 -->
        <div class="card-wrapper">

            <div
                class="profile-card"
                onclick="openGallery()"
            >

                <img
                    src="photos/field-cover.jpg"
                    alt="Field Learning Activity"
                >

            </div>

            <div class="profile-name">
                Field Learning Activity
            </div>

        </div>


        <!-- CARD 2 -->
        <div class="card-wrapper">

            <div class="profile-card">

                <img
                    src="photos/profile-2.jpg"
                    alt="Profile 2"
                >

            </div>

            <div class="profile-name">
                Profile 2
            </div>

        </div>


        <!-- CARD 3 -->
        <div class="card-wrapper">

            <div class="profile-card">

                <img
                    src="photos/profile-3.jpg"
                    alt="Profile 3"
                >

            </div>

            <div class="profile-name">
                Profile 3
            </div>

        </div>

    </div>

</main>


<!-- =========================
     GALLERY MODAL
========================= -->

<div
    id="galleryModal"
    class="gallery-modal"
    onclick="galleryBackgroundClick(event)"
>

    <div
        class="gallery-box"
        onclick="event.stopPropagation()"
    >

        <span
            class="gallery-close"
            onclick="closeGallery()"
        >
            &times;
        </span>

        <h2 class="gallery-title">
            Field Learning Activity
        </h2>


        <!-- =========================
             GROUPS 1 TO 30
        ========================== -->

        <div id="galleryGroups"></div>

    </div>

</div>


<!-- =========================
     FULLSCREEN PHOTO VIEWER
========================= -->

<div
    id="photoViewer"
    class="photo-viewer"
    onclick="viewerBackgroundClick(event)"
>

    <span
        class="viewer-close"
        onclick="closePhoto()"
    >
        &times;
    </span>

    <img
        id="largePhoto"
        src=""
        alt="Large Photo"
        onclick="event.stopPropagation()"
    >

</div>


<script>

/* ==========================================
   GENERATE 30 GROUPS × 5 PHOTOS = 150 PHOTOS
========================================== */

const galleryGroups = document.getElementById("galleryGroups");

for(let group = 1; group <= 30; group++){

    const groupNumber = String(group).padStart(2, "0");

    const groupDiv = document.createElement("div");

    groupDiv.className = "gallery-group";


    /* GROUP TITLE */

    const title = document.createElement("div");

    title.className = "group-title";

    title.textContent = "Group " + group;

    groupDiv.appendChild(title);


    /* PHOTO GRID */

    const photoGrid = document.createElement("div");

    photoGrid.className = "photo-grid";


    /* 5 PHOTOS */

    for(let photo = 1; photo <= 5; photo++){

        const photoNumber = String(photo).padStart(2, "0");

        const img = document.createElement("img");

        img.src =
            "photos/field-" +
            groupNumber +
            "-" +
            photoNumber +
            ".jpg";

        img.alt =
            "Field Learning Activity - Group " +
            group +
            " Photo " +
            photo;

        /*
           Clicking any gallery photo
           opens fullscreen viewer.
        */
        img.onclick = function(){

            openPhoto(this.src);

        };

        photoGrid.appendChild(img);

    }


    groupDiv.appendChild(photoGrid);


    /* =========================
       TEXT AFTER 5 PHOTOS
    ========================= */

    const text = document.createElement("div");

    text.className = "group-text";


    if(group === 1){

        /*
           FIRST GROUP TEXT
        */
        text.textContent = "Pawan Bhoyar";

    }
    else{

        /*
           You can change these later.
        */
        text.textContent =
            "Add your text here.";

    }


    groupDiv.appendChild(text);

    galleryGroups.appendChild(groupDiv);

}


/* ==========================================
   OPEN GALLERY
========================================== */

function openGallery(){

    document.getElementById("galleryModal").style.display = "block";

    document.body.style.overflow = "hidden";

}


/* ==========================================
   CLOSE GALLERY
========================================== */

function closeGallery(){

    document.getElementById("galleryModal").style.display = "none";

    document.body.style.overflow = "";

}


/* ==========================================
   OPEN LARGE PHOTO
========================================== */

function openPhoto(src){

    const viewer =
        document.getElementById("photoViewer");

    const largePhoto =
        document.getElementById("largePhoto");

    largePhoto.src = src;

    viewer.style.display = "flex";

}


/* ==========================================
   CLOSE LARGE PHOTO
========================================== */

function closePhoto(){

    const viewer =
        document.getElementById("photoViewer");

    const largePhoto =
        document.getElementById("largePhoto");

    viewer.style.display = "none";

    largePhoto.src = "";

}


/* ==========================================
   CLICK OUTSIDE LARGE PHOTO
========================================== */

function viewerBackgroundClick(event){

    if(event.target.id === "photoViewer"){

        closePhoto();

    }

}


/* ==========================================
   CLICK OUTSIDE GALLERY
========================================== */

function galleryBackgroundClick(event){

    if(event.target.id === "galleryModal"){

        closeGallery();

    }

}


/* ==========================================
   ESC KEY
========================================== */

document.addEventListener("keydown", function(event){

    if(event.key === "Escape"){

        const viewer =
            document.getElementById("photoViewer");

        const gallery =
            document.getElementById("galleryModal");


        /* Close large photo first */

        if(viewer.style.display === "flex"){

            closePhoto();

            return;

        }


        /* Then close gallery */

        if(gallery.style.display === "block"){

            closeGallery();

        }

    }

});

</script>

</body>
</html>
```
