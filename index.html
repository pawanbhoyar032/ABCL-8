<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Life Insurance - Profile Gallery</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#1d2433;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    text-align:center;
    padding:30px 20px 20px;
}

.logo{
    width:220px;
    max-width:80%;
    height:auto;
    display:block;
    margin:0 auto 18px;
}

.intro{
    font-size:17px;
    color:#555;
    line-height:1.6;
}


/* =========================================================
   MAIN
   ========================================================= */

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.card-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:35px;
}


/* =========================================================
   COVER CARD
   ========================================================= */

.profile-card{
    width:320px;
    max-width:100%;
    background:white;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.profile-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 28px rgba(0,0,0,0.18);
}

.profile-card img{
    width:100%;
    height:250px;
    display:block;
    object-fit:cover;
}

.profile-name{
    margin-top:-22px;
    padding:0 10px;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    position:relative;
    z-index:2;
}

.card-title{
    margin-top:14px;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    color:#1d2433;
}


/* =========================================================
   GALLERY MODAL
   ========================================================= */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    overflow-y:auto;
    padding:30px 20px;
}

.modal-content{
    max-width:1400px;
    margin:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    color:white;
}

.modal-title{
    font-size:28px;
    font-weight:bold;
}

.close-btn{
    font-size:42px;
    color:white;
    cursor:pointer;
    line-height:1;
    border:none;
    background:none;
}


/* =========================================================
   OLD GALLERY PHOTO GROUP
   ========================================================= */

.gallery-group{
    margin-bottom:40px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    align-items:start;
}

.photo-grid img{
    width:100%;
    aspect-ratio:3 / 4;
    height:auto;
    display:block;
    cursor:pointer;
    border-radius:8px;
    background:#fff;
    object-fit:contain;
    transition:transform 0.2s ease;
}

.photo-grid img:hover{
    transform:scale(1.02);
}

.group-text{
    color:white;
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-top:14px;
}


/* =========================================================
   NEW INSURANCE AWARENESS GALLERY
   2 PHOTOS
   TEXT
   DESCRIPTION
   ========================================================= */

.insurance-group{
    margin-bottom:55px;
    padding-bottom:35px;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

.insurance-photo-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
    max-width:850px;
    margin:0 auto;
}

.insurance-photo-grid img{
    width:100%;
    aspect-ratio:3 / 4;
    height:auto;
    display:block;
    cursor:pointer;
    border-radius:10px;
    background:white;
    object-fit:contain;
    transition:transform 0.2s ease;
}

.insurance-photo-grid img:hover{
    transform:scale(1.02);
}

.insurance-text{
    color:white;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:18px;
}

.insurance-description{
    color:#e5e5e5;
    text-align:center;
    font-size:16px;
    line-height:1.7;
    max-width:850px;
    margin:10px auto 0;
}


/* =========================================================
   FULLSCREEN PHOTO VIEWER
   ========================================================= */

.photo-viewer{
    display:none;
    position:fixed;
    z-index:2000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.96);
    justify-content:center;
    align-items:center;
    padding:30px;
}

.photo-viewer img{
    max-width:95vw;
    max-height:90vh;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
}

.viewer-close{
    position:absolute;
    top:15px;
    right:25px;
    color:white;
    font-size:45px;
    cursor:pointer;
    line-height:1;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer{
    text-align:center;
    padding:30px 15px;
    margin-top:50px;
    color:#666;
    font-size:14px;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

    .photo-grid{
        grid-template-columns:repeat(3, 1fr);
    }

}


@media(max-width:600px){

    .header{
        padding-top:20px;
    }

    .logo{
        width:180px;
    }

    .intro{
        font-size:15px;
    }

    .photo-grid{
        grid-template-columns:repeat(2, 1fr);
        gap:8px;
    }

    .insurance-photo-grid{
        grid-template-columns:repeat(2, 1fr);
        gap:8px;
    }

    .modal{
        padding:20px 10px;
    }

    .modal-title{
        font-size:21px;
    }

    .group-text{
        font-size:18px;
    }

    .insurance-text{
        font-size:19px;
    }

    .insurance-description{
        font-size:14px;
    }

    .profile-card{
        width:100%;
        max-width:340px;
    }

}

</style>
</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="header">

    <img
        id="ap1kaz"
        class="logo"
        src="photos/logo.png"
        alt="ABC Life Insurance Logo"
    >

    <p class="intro">
        Welcome to the ABC Life Insurance Profile Gallery.
        Explore and Connect with our people.
    </p>

</header>



<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="container">

    <div class="card-wrapper">


        <!-- =================================================
             OLD COVER CARD
             FIELD LEARNING ACTIVITY
             ================================================= -->

        <div
            class="profile-card"
            onclick="openGallery()"
        >

            <img
                src="photos/field-cover.jpg"
                alt="Field Learning Activity"
            >

            <div class="card-title">
                Field Learning Activity
            </div>

        </div>



        <!-- =================================================
             NEW COVER CARD
             INSURANCE AWARENESS – ROLE PLAY
             ================================================= -->

        <div
            class="profile-card"
            onclick="openInsuranceGallery()"
        >

            <img
                src="photos/insurance-awareness-cover.jpg"
                alt="Insurance Awareness – Role Play"
            >

            <div class="card-title">
                Insurance Awareness – Role Play
            </div>

        </div>


    </div>

</main>



<!-- =========================================================
     OLD GALLERY MODAL
     FIELD LEARNING ACTIVITY
     ========================================================= -->

<div
    id="galleryModal"
    class="modal"
    onclick="galleryBackgroundClick(event)"
>

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-title">
                Field Learning Activity
            </div>

            <button
                class="close-btn"
                onclick="closeGallery()"
                aria-label="Close Gallery"
            >
                &times;
            </button>

        </div>

        <div id="galleryGroups"></div>

    </div>

</div>



<!-- =========================================================
     NEW GALLERY MODAL
     INSURANCE AWARENESS – ROLE PLAY
     ========================================================= -->

<div
    id="insuranceGalleryModal"
    class="modal"
    onclick="insuranceBackgroundClick(event)"
>

    <div class="modal-content">

        <div class="modal-header">

            <div class="modal-title">
                Insurance Awareness – Role Play
            </div>

            <button
                class="close-btn"
                onclick="closeInsuranceGallery()"
                aria-label="Close Gallery"
            >
                &times;
            </button>

        </div>

        <div id="insuranceGroups"></div>

    </div>

</div>



<!-- =========================================================
     FULLSCREEN PHOTO VIEWER
     ========================================================= -->

<div
    id="photoViewer"
    class="photo-viewer"
    onclick="viewerBackgroundClick(event)"
>

    <span
        class="viewer-close"
        onclick="closePhoto()"
        aria-label="Close Photo"
    >
        &times;
    </span>

    <img
        id="largePhoto"
        src=""
        alt="Large Photo"
    >

</div>



<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer class="footer">

    <p>
        © 2026 ABC Life Insurance | All Rights Reserved.
    </p>

</footer>



<script>


/* =========================================================
   OLD GALLERY
   NAMES
   ========================================================= */

const names = [

    "1. Pawan Bhoyar",
    "2. Satyam Pandey",
    "3. Vinod Kumar",
    "4. Yogendra Rana",

    "5. Abendra Mishra",
    "6. Gayathri Krishnan",
    "7. K.Dhivya",
    "8. Mahesh Sajjan",
    "9. Vaibhav Shukla",
    "10. Jaya",

    "11. Rohan Yadav",
    "12. Nitin Shukla",
    "13. Akash Mohanty",
    "14. Devendra singh",
    "15. Deepak Jatav",

    "16. C R Adhithya Kumar",
    "17. Sumit Kumar",
    "18. Lokesh Kaimoria",
    "19. Kshma Kumari",
    "20. Jayakrishna Sai",

    "21. Apanna Patra",
    "22. Rakesh Chaurasiya",
    "23. Gourav Sengupta",
    "24. Shubham Kharde",
    "25. Sonam Kumari",
    "26. Siva Bramha Ganesh",
    "27. Rahul Kumar",
    "28. Bandaru Venkateshwarlu",
    "29. Vinita Bhardwaj",
    "30. Shivani Rajpoot",

    "31. Beddala Raj Kumar"

];



/* =========================================================
   EXISTING FIRST 20 PHOTOS
   ========================================================= */

const oldPhotos = [

    "field-01-01.jpg",
    "field-01-02.jpg",
    "field-01-03.jpg",
    "field-01-04.jpg",
    "field-01-05.jpg",

    "field-02-01.jpg",
    "field-02-02.jpg",
    "field-02-03.jpg",
    "field-02-04.jpg",
    "field-02-05.jpg",

    "field-03-01.jpg",
    "field-03-02.jpg",
    "field-03-03.jpg",
    "field-03-04.jpg",
    "field-03-05.jpg",

    "field-04-01.jpg",
    "field-04-02.jpg",
    "field-04-03.jpg",
    "field-04-04.jpg",
    "field-04-05.jpg"

];



/* =========================================================
   NEXT 135 PHOTOS
   21.jpg TO 155.jpg
   ========================================================= */

const newPhotos = [];

for(let i = 21; i <= 155; i++){

    newPhotos.push(i + ".jpg");

}



/* =========================================================
   COMBINE ALL 155 PHOTOS
   ========================================================= */

const allPhotos = [

    ...oldPhotos,
    ...newPhotos

];



/* =========================================================
   CREATE OLD 31 GROUPS
   EVERY GROUP = 5 PHOTOS
   ========================================================= */

const galleryGroups =
    document.getElementById("galleryGroups");


for(let group = 0; group < 31; group++){

    const groupDiv =
        document.createElement("div");

    groupDiv.className = "gallery-group";


    const photoGrid =
        document.createElement("div");

    photoGrid.className = "photo-grid";


    /* ADD 5 PHOTOS */

    for(let photo = 0; photo < 5; photo++){

        const photoIndex =
            (group * 5) + photo;


        const img =
            document.createElement("img");


        img.src =
            "photos/" + allPhotos[photoIndex];


        img.alt =
            "Field Learning Activity Photo " +
            (photoIndex + 1);


        img.onclick = function(){

            openPhoto(this.src);

        };


        photoGrid.appendChild(img);

    }


    groupDiv.appendChild(photoGrid);


    /* ADD NAME AFTER EVERY 5 PHOTOS */

    const text =
        document.createElement("div");


    text.className = "group-text";


    text.textContent =
        names[group] || "Add Name Here";


    groupDiv.appendChild(text);


    galleryGroups.appendChild(groupDiv);

}



/* =========================================================
   NEW INSURANCE AWARENESS DATA
   6 GROUPS
   2 PHOTOS PER GROUP
   ========================================================= */

const insuranceSections = [

    {
        photos: [
            "insurance-01-01.jpg",
            "insurance-01-02.jpg"
        ],

        text: "1. Insurance Awareness",

        description:
        "Students introduced the importance of insurance and explained why financial protection is important."
    },


    {
        photos: [
            "insurance-02-01.jpg",
            "insurance-02-02.jpg"
        ],

        text: "2. Understanding Insurance",

        description:
        "The role play helped students understand the basic concept of insurance in a simple and engaging way."
    },


    {
        photos: [
            "insurance-03-01.jpg",
            "insurance-03-02.jpg"
        ],

        text: "3. Customer Awareness",

        description:
        "Students presented situations showing how insurance can provide financial support during unexpected events."
    },


    {
        photos: [
            "insurance-04-01.jpg",
            "insurance-04-02.jpg"
        ],

        text: "4. Role Play Activity",

        description:
        "Students performed different roles to demonstrate insurance awareness through a practical role play."
    },


    {
        photos: [
            "insurance-05-01.jpg",
            "insurance-05-02.jpg"
        ],

        text: "5. Learning Through Activity",

        description:
        "The activity encouraged students to learn important insurance concepts through participation and teamwork."
    },


    {
        photos: [
            "insurance-06-01.jpg",
            "insurance-06-02.jpg"
        ],

        text: "6. Insurance Awareness Message",

        description:
        "The role play concluded with a simple message highlighting the importance of awareness and financial protection."
    }

];



/* =========================================================
   CREATE INSURANCE GALLERY
   6 GROUPS
   ========================================================= */

const insuranceGroups =
    document.getElementById("insuranceGroups");


insuranceSections.forEach(function(section, index){

    const groupDiv =
        document.createElement("div");

    groupDiv.className =
        "insurance-group";


    /* PHOTO GRID */

    const photoGrid =
        document.createElement("div");

    photoGrid.className =
        "insurance-photo-grid";


    section.photos.forEach(function(photoName){

        const img =
            document.createElement("img");


        img.src =
            "photos/" + photoName;


        img.alt =
            "Insurance Awareness – Role Play Photo";


        img.onclick = function(){

            openPhoto(this.src);

        };


        photoGrid.appendChild(img);

    });


    groupDiv.appendChild(photoGrid);


    /* TEXT */

    const text =
        document.createElement("div");

    text.className =
        "insurance-text";

    text.textContent =
        section.text;


    groupDiv.appendChild(text);


    /* DESCRIPTION */

    const description =
        document.createElement("div");

    description.className =
        "insurance-description";

    description.textContent =
        section.description;


    groupDiv.appendChild(description);


    insuranceGroups.appendChild(groupDiv);

});



/* =========================================================
   OPEN OLD GALLERY
   ========================================================= */

function openGallery(){

    document.getElementById("galleryModal")
        .style.display = "block";

    document.body.style.overflow = "hidden";

}



/* =========================================================
   CLOSE OLD GALLERY
   ========================================================= */

function closeGallery(){

    document.getElementById("galleryModal")
        .style.display = "none";

    document.body.style.overflow = "";

}



/* =========================================================
   OPEN NEW INSURANCE GALLERY
   ========================================================= */

function openInsuranceGallery(){

    document.getElementById("insuranceGalleryModal")
        .style.display = "block";

    document.body.style.overflow = "hidden";

}



/* =========================================================
   CLOSE NEW INSURANCE GALLERY
   ========================================================= */

function closeInsuranceGallery(){

    document.getElementById("insuranceGalleryModal")
        .style.display = "none";

    document.body.style.overflow = "";

}



/* =========================================================
   OPEN LARGE PHOTO
   ========================================================= */

function openPhoto(src){

    const viewer =
        document.getElementById("photoViewer");


    const largePhoto =
        document.getElementById("largePhoto");


    largePhoto.src = src;


    viewer.style.display = "flex";

}



/* =========================================================
   CLOSE LARGE PHOTO
   ========================================================= */

function closePhoto(){

    const viewer =
        document.getElementById("photoViewer");


    viewer.style.display = "none";


    document.getElementById("largePhoto").src = "";

}



/* =========================================================
   CLOSE PHOTO WHEN CLICKING OUTSIDE IMAGE
   ========================================================= */

function viewerBackgroundClick(event){

    if(event.target.id === "photoViewer"){

        closePhoto();

    }

}



/* =========================================================
   CLOSE OLD GALLERY OUTSIDE CONTENT
   ========================================================= */

function galleryBackgroundClick(event){

    if(event.target.id === "galleryModal"){

        closeGallery();

    }

}



/* =========================================================
   CLOSE NEW GALLERY OUTSIDE CONTENT
   ========================================================= */

function insuranceBackgroundClick(event){

    if(event.target.id === "insuranceGalleryModal"){

        closeInsuranceGallery();

    }

}



/* =========================================================
   ESC KEY
   ========================================================= */

document.addEventListener("keydown", function(event){

    if(event.key === "Escape"){

        const viewer =
            document.getElementById("photoViewer");

        const gallery =
            document.getElementById("galleryModal");

        const insuranceGallery =
            document.getElementById("insuranceGalleryModal");


        if(viewer.style.display === "flex"){

            closePhoto();

        }

        else if(gallery.style.display === "block"){

            closeGallery();

        }

        else if(insuranceGallery.style.display === "block"){

            closeInsuranceGallery();

        }

    }

});

</script>


</body>
</html>
