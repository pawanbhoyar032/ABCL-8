<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Life Insurance - Profile Gallery</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fb;
    color:#1d2433;
}

/* HEADER */

header{
    background:white;
    padding:25px 20px;
    text-align:center;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
}

header img{
    width:190px;
    max-width:80%;
    height:auto;
}

/* INTRO */

.intro{
    text-align:center;
    padding:30px 20px 10px;
}

.intro h1{
    font-size:30px;
    margin-bottom:10px;
}

.intro p{
    font-size:16px;
    color:#666;
}

/* COVER CARDS */

.card-wrapper{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-direction:row;
    gap:35px;
    flex-wrap:wrap;
    padding:30px 20px 50px;
}

.profile-card{
    width:320px;
    max-width:100%;
    background:white;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
}

.profile-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 28px rgba(0,0,0,0.18);
}

.profile-card img{
    width:100%;
    height:250px;
    display:block;
    object-fit:cover;
}

.card-title{
    margin-top:14px;
    padding:0 10px 18px;
    font-size:20px;
    font-weight:bold;
    text-align:center;
    color:#1d2433;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    overflow:auto;
}

.modal-content{
    width:95%;
    max-width:1400px;
    margin:30px auto;
    padding:20px;
}

.modal-header{
    position:relative;
    text-align:center;
    margin-bottom:30px;
}

.modal-header h2{
    color:white;
    font-size:28px;
}

.close{
    position:fixed;
    right:25px;
    top:15px;
    color:white;
    font-size:42px;
    font-weight:bold;
    cursor:pointer;
    z-index:1100;
    line-height:1;
}

.close:hover{
    opacity:0.7;
}

/* FIELD LEARNING */

.photo-group{
    margin-bottom:55px;
    padding-bottom:35px;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    align-items:start;
}

.photo-grid img{
    width:100%;
    aspect-ratio:3 / 4;
    height:auto;
    display:block;
    cursor:pointer;
    border-radius:8px;
    background:#fff;
    object-fit:contain;
    transition:transform 0.2s ease;
}

.photo-grid img:hover{
    transform:scale(1.03);
}

.photo-name{
    color:white;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-top:18px;
}

/* INSURANCE AWARENESS */

.insurance-group{
    margin-bottom:55px;
    padding-bottom:35px;
    border-bottom:1px solid rgba(255,255,255,0.25);
}

.insurance-photo-grid{
    display:flex;
    justify-content:center;
    align-items:center;
    max-width:500px;
    margin:0 auto;
}

.insurance-photo-grid img{
    width:100%;
    max-width:500px;
    aspect-ratio:3 / 4;
    height:auto;
    display:block;
    cursor:pointer;
    border-radius:10px;
    background:white;
    object-fit:contain;
    transition:transform 0.2s ease;
}

.insurance-photo-grid img:hover{
    transform:scale(1.03);
}

.insurance-text{
    color:white;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:18px;
}

.insurance-description{
    color:#e5e5e5;
    text-align:center;
    font-size:16px;
    line-height:1.7;
    max-width:850px;
    margin:10px auto 0;
}

/* FULL SCREEN PHOTO VIEWER */

.photo-viewer{
    display:none;
    position:fixed;
    z-index:2000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.96);
    justify-content:center;
    align-items:center;
    padding:30px;
}

.photo-viewer img{
    max-width:95%;
    max-height:92%;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:6px;
}

.viewer-close{
    position:absolute;
    top:15px;
    right:25px;
    color:white;
    font-size:45px;
    cursor:pointer;
    z-index:2100;
}

/* MOBILE */

@media(max-width:900px){

    .photo-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:600px){

    .card-wrapper{
        flex-direction:column;
        align-items:center;
    }

    .profile-card{
        width:320px;
    }

    .intro h1{
        font-size:24px;
    }

    .modal-content{
        width:100%;
        padding:15px;
        margin-top:35px;
    }

    .modal-header h2{
        font-size:22px;
    }

    .photo-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .photo-name{
        font-size:19px;
    }

    .insurance-photo-grid{
        max-width:100%;
    }

    .insurance-text{
        font-size:20px;
    }

    .insurance-description{
        font-size:15px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>
    <img src="photos/logo.png" alt="ABC Life Insurance Logo">
</header>

<!-- INTRO -->

<section class="intro">

    <h1>ABC Life Insurance Profile Gallery</h1>

    <p>
        Welcome to the ABC Life Insurance Profile Gallery.
        Explore and Connect with our people.
    </p>

</section>


<!-- COVER CARDS -->

<div class="card-wrapper">

    <!-- FIELD LEARNING CARD -->

    <div class="profile-card" onclick="openGallery()">

        <img
            src="photos/field-cover.jpg"
            alt="Field Learning Activity"
        >

        <div class="card-title">
            Field Learning Activity
        </div>

    </div>


    <!-- INSURANCE AWARENESS CARD -->

    <div class="profile-card" onclick="openInsuranceGallery()">

        <img
            src="photos/insurance-awareness-cover.jpg"
            alt="Insurance Awareness – Role Play"
        >

        <div class="card-title">
            Insurance Awareness – Role Play
        </div>

    </div>

</div>


<!-- FIELD LEARNING MODAL -->

<div id="galleryModal" class="modal">

    <span class="close" onclick="closeGallery()">&times;</span>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Field Learning Activity
            </h2>

        </div>

        <div id="galleryContainer"></div>

    </div>

</div>


<!-- INSURANCE AWARENESS MODAL -->

<div id="insuranceGalleryModal" class="modal">

    <span class="close" onclick="closeInsuranceGallery()">&times;</span>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Insurance Awareness – Role Play
            </h2>

        </div>

        <div id="insuranceContainer"></div>

    </div>

</div>


<!-- FULL SCREEN PHOTO VIEWER -->

<div id="photoViewer" class="photo-viewer">

    <span class="viewer-close" onclick="closePhoto()">
        &times;
    </span>

    <img id="viewerImage" src="" alt="Full Size Photo">

</div>


<script>

/* =========================================================
   FIELD LEARNING ACTIVITY
   ========================================================= */


/* Existing first 20 photos */

const oldPhotos = [

    "field-01-01.jpg",
    "field-01-02.jpg",
    "field-01-03.jpg",
    "field-01-04.jpg",
    "field-01-05.jpg",

    "field-02-01.jpg",
    "field-02-02.jpg",
    "field-02-03.jpg",
    "field-02-04.jpg",
    "field-02-05.jpg",

    "field-03-01.jpg",
    "field-03-02.jpg",
    "field-03-03.jpg",
    "field-03-04.jpg",
    "field-03-05.jpg",

    "field-04-01.jpg",
    "field-04-02.jpg",
    "field-04-03.jpg",
    "field-04-04.jpg",
    "field-04-05.jpg"

];


/* Photos 21 to 155 */

const newPhotos = [];

for(let i = 21; i <= 155; i++){

    newPhotos.push(i + ".jpg");

}


/* Section 32 photos
   156.jpg to 160.jpg
*/

const section32Photos = [

    "156.jpg",
    "157.jpg",
    "158.jpg",
    "159.jpg",
    "160.jpg"

];


/* Combine all photos */

const allPhotos = [

    ...oldPhotos,
    ...newPhotos,
    ...section32Photos

];


/* Names */

const names = [

    "1. Pawan Bhoyar",
    "2. Satyam Pandey",
    "3. Vinod Kumar",
    "4. Yogendra Rana",
    "5. Abendra Mishra",
    "6. Gayathri Krishnan",
    "7. K.Dhivya",
    "8. Mahesh Sajjan",
    "9. Vaibhav Shukla",
    "10. Jaya",
    "11. Rohan Yadav",
    "12. Nitin Shukla",
    "13. Akash Mohanty",
    "14. Devendra singh",
    "15. Deepak Jatav",
    "16. C R Adhithya Kumar",
    "17. Sumit Kumar",
    "18. Lokesh Kaimoria",
    "19. Kshma Kumari",
    "20. Jayakrishna Sai",
    "21. Apanna Patra",
    "22. Rakesh Chaurasiya",
    "23. Gourav Sengupta",
    "24. Shubham Kharde",
    "25. Sonam Kumari",
    "26. Siva Bramha Ganesh",
    "27. Rahul Kumar",
    "28. Bandaru Venkateshwarlu",
    "29. Vinita Bhardwaj",
    "30. Shivani Rajpoot",
    "31. Beddala Raj Kumar",

    /* Section 32 */
    "32. Add Name Here"

];


/* Open Field Gallery */

function openGallery(){

    const modal =
        document.getElementById("galleryModal");

    const container =
        document.getElementById("galleryContainer");

    container.innerHTML = "";


    /*
       32 sections
       Each section = 5 photos
    */

    for(let section = 0; section < 32; section++){

        const group =
            document.createElement("div");

        group.className = "photo-group";


        const grid =
            document.createElement("div");

        grid.className = "photo-grid";


        for(let i = 0; i < 5; i++){

            const photoIndex =
                section * 5 + i;


            if(photoIndex < allPhotos.length){

                const img =
                    document.createElement("img");

                img.src =
                    "photos/" + allPhotos[photoIndex];

                img.alt =
                    "Field Learning Activity";

                img.onclick = function(){

                    openPhoto(this.src);

                };


                grid.appendChild(img);

            }

        }


        group.appendChild(grid);


        /* Name after every 5 photos */

        if(names[section]){

            const name =
                document.createElement("div");

            name.className = "photo-name";

            name.textContent =
                names[section];

            group.appendChild(name);

        }


        container.appendChild(group);

    }


    modal.style.display = "block";

    document.body.style.overflow = "hidden";

}


/* Close Field Gallery */

function closeGallery(){

    document.getElementById("galleryModal")
        .style.display = "none";

    document.body.style.overflow = "auto";

}


/* =========================================================
   INSURANCE AWARENESS – ROLE PLAY
   ONE PHOTO PER SECTION
   ========================================================= */


const insuranceSections = [

    {
        photos:[
            "insurance-01-01.jpg"
        ],

        text:
            "1. Insurance Awareness",

        description:
            "Students introduced the importance of insurance and explained why financial protection is important."
    },


    {
        photos:[
            "insurance-02-01.jpg"
        ],

        text:
            "2. Understanding Insurance",

        description:
            "The role play helped students understand the basic concept of insurance in a simple and engaging way."
    },


    {
        photos:[
            "insurance-03-01.jpg"
        ],

        text:
            "3. Customer Awareness",

        description:
            "Students presented situations showing how insurance can provide financial support during unexpected events."
    },


    {
        photos:[
            "insurance-04-01.jpg"
        ],

        text:
            "4. Role Play Activity",

        description:
            "Students performed different roles to demonstrate insurance awareness through a practical role play."
    },


    {
        photos:[
            "insurance-05-01.jpg"
        ],

        text:
            "5. Learning Through Activity",

        description:
            "The activity encouraged students to learn important insurance concepts through participation and teamwork."
    },


    {
        photos:[
            "insurance-06-01.jpg"
        ],

        text:
            "6. Insurance Awareness Message",

        description:
            "The role play concluded with a simple message highlighting the importance of awareness and financial protection."
    }

];


/* Open Insurance Gallery */

function openInsuranceGallery(){

    const modal =
        document.getElementById(
            "insuranceGalleryModal"
        );

    const container =
        document.getElementById(
            "insuranceContainer"
        );

    container.innerHTML = "";


    insuranceSections.forEach(function(section){

        const group =
            document.createElement("div");

        group.className =
            "insurance-group";


        const photoGrid =
            document.createElement("div");

        photoGrid.className =
            "insurance-photo-grid";


        /*
           Only ONE photo per section
        */

        section.photos.forEach(function(photo){

            const img =
                document.createElement("img");

            img.src =
                "photos/" + photo;

            img.alt =
                section.text;

            img.onclick = function(){

                openPhoto(this.src);

            };


            photoGrid.appendChild(img);

        });


        group.appendChild(photoGrid);


        const text =
            document.createElement("div");

        text.className =
            "insurance-text";

        text.textContent =
            section.text;


        group.appendChild(text);


        const description =
            document.createElement("div");

        description.className =
            "insurance-description";

        description.textContent =
            section.description;


        group.appendChild(description);


        container.appendChild(group);

    });


    modal.style.display = "block";

    document.body.style.overflow = "hidden";

}


/* Close Insurance Gallery */

function closeInsuranceGallery(){

    document.getElementById(
        "insuranceGalleryModal"
    ).style.display = "none";

    document.body.style.overflow = "auto";

}


/* =========================================================
   FULL SCREEN PHOTO
   ========================================================= */


function openPhoto(src){

    const viewer =
        document.getElementById("photoViewer");

    const image =
        document.getElementById("viewerImage");


    image.src = src;

    viewer.style.display = "flex";

}


function closePhoto(){

    const viewer =
        document.getElementById("photoViewer");

    const image =
        document.getElementById("viewerImage");


    viewer.style.display = "none";

    image.src = "";

}


/* =========================================================
   CLOSE MODALS BY CLICKING OUTSIDE
   ========================================================= */

window.onclick = function(event){

    const galleryModal =
        document.getElementById("galleryModal");

    const insuranceModal =
        document.getElementById(
            "insuranceGalleryModal"
        );

    const viewer =
        document.getElementById("photoViewer");


    if(event.target === galleryModal){

        closeGallery();

    }


    if(event.target === insuranceModal){

        closeInsuranceGallery();

    }


    if(event.target === viewer){

        closePhoto();

    }

};


/* ESC KEY */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeGallery();

            closeInsuranceGallery();

            closePhoto();

        }

    }
);

</script>

</body>
</html>
