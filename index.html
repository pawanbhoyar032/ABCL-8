<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Life Insurance - Profile Gallery</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1d2433;
}

/* ================= HEADER ================= */

header{
  background:white;
  border-bottom:1px solid #e5e7eb;
  padding:15px 30px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* LOGO */

.abc-logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#1769aa;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.logo-text{
  display:flex;
  flex-direction:column;
  line-height:1.1;
}

.logo-text strong{
  font-size:25px;
  color:#1769aa;
  letter-spacing:1px;
}

.logo-text span{
  font-size:12px;
  color:#555;
  margin-top:5px;
  letter-spacing:.5px;
}

/* ================= HERO ================= */

.hero{
  max-width:1200px;
  margin:35px auto 20px;
  padding:0 20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#666;
  font-size:15px;
}

/* ================= PROFILE GRID ================= */

.container{
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.profile-card{
  background:white;
  border-radius:16px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  border:1px solid #e5e7eb;
  transition:.25s;
}

.profile-card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,.10);
}

.profile-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #eef4fb;
  margin-bottom:12px;
}

.profile-card h3{
  font-size:18px;
  margin-bottom:5px;
}

.profile-card .role{
  color:#1769aa;
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.profile-card p{
  font-size:13px;
  color:#666;
  line-height:1.5;
}

/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:999;
  padding:30px 15px;
  overflow-y:auto;
}

.modal-content{
  max-width:850px;
  background:white;
  margin:auto;
  border-radius:18px;
  padding:25px;
  position:relative;
}

.close{
  position:absolute;
  right:18px;
  top:12px;
  font-size:30px;
  cursor:pointer;
  color:#555;
}

.modal-content h2{
  margin-bottom:5px;
}

.modal-role{
  color:#1769aa;
  font-weight:bold;
  margin-bottom:15px;
}

.modal-text{
  color:#666;
  line-height:1.6;
  margin-bottom:20px;
}

.main-photo{
  width:100%;
  max-height:450px;
  object-fit:contain;
  border-radius:12px;
  background:#f1f3f5;
  margin-bottom:15px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
}

.gallery img:hover{
  border-color:#1769aa;
}

/* ================= FOOTER ================= */

footer{
  margin-top:50px;
  padding:25px;
  background:#17202a;
  color:white;
  text-align:center;
  font-size:13px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){
  .profile-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){
  header{
    padding:12px 15px;
  }

  .logo-icon{
    width:42px;
    height:42px;
    font-size:22px;
  }

  .logo-text strong{
    font-size:21px;
  }

  .profile-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .profile-card{
    padding:15px;
  }

  .profile-avatar{
    width:85px;
    height:85px;
  }

  .gallery{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:450px){
  .profile-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:26px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

/* =====================================================
   RENDER PROFILES
   ===================================================== */

function renderProfiles(){

  const grid=document.getElementById("profileGrid");

  grid.innerHTML="";

  profiles.forEach((profile,index)=>{

    const firstPhoto =
      profile.photos.length > 0
      ? "photos/" + profile.photos[0]
      : "";

    const card=document.createElement("div");

    card.className="profile-card";

    card.onclick=()=>{
      openProfile(index);
    };

    card.innerHTML=`

      ${
        firstPhoto
        ?
        `<img
          src="${firstPhoto}"
          class="profile-avatar"
          alt="${profile.name}"
          onerror="this.style.display='none'"
        >`
        :
        ""
      }

      <h3>${escapeHtml(profile.name)}</h3>

      <div class="role">
        ${escapeHtml(profile.role)}
      </div>

      <p>
        ${escapeHtml(profile.text)}
      </p>

    `;

    grid.appendChild(card);

  });

}


/* =====================================================
   OPEN PROFILE
   ===================================================== */

function openProfile(index){

  const profile=profiles[index];

  document.getElementById("modalName").textContent=
    profile.name;

  document.getElementById("modalRole").textContent=
    profile.role;

  document.getElementById("modalText").textContent=
    profile.text;

  const mainPhoto=document.getElementById("mainPhoto");

  const gallery=document.getElementById("gallery");

  gallery.innerHTML="";

  if(profile.photos.length>0){

    mainPhoto.src=
      "photos/"+profile.photos[0];

    mainPhoto.style.display="block";

    profile.photos.forEach(photo=>{

      const img=document.createElement("img");

      img.src="photos/"+photo;

      img.alt=profile.name;

      img.onclick=()=>{
        mainPhoto.src="photos/"+photo;
      };

      gallery.appendChild(img);

    });

  }else{

    mainPhoto.style.display="none";

  }

  document.getElementById("profileModal").style.display="block";

  document.body.style.overflow="hidden";
}


/* =====================================================
   CLOSE MODAL
   ===================================================== */

function closeModal(){

  document.getElementById("profileModal").style.display="none";

  document.body.style.overflow="auto";
}


/* =====================================================
   CLOSE WHEN CLICK OUTSIDE
   ===================================================== */

window.onclick=function(event){

  const modal=document.getElementById("profileModal");

  if(event.target===modal){

    closeModal();

  }

};


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}
